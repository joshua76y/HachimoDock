dependencies:
  espressif/esp-sr: "2.5.3"
  espressif/esp_h264: "^1.3.6"
  # ESP32-P4 没有原生 WiFi 射频。板载 ESP32-C6-MINI-1 经 SDIO 提供 WiFi6，
  # 微雪出厂已预烧 ESP-Hosted slave 固件，无需再烧 C6。
  # esp_wifi_remote 把标准 esp_wifi API 转发给 C6，因此 RLCD 的 WiFi 代码可原样复用。
  # 版本对应：IDF 5.5.x(<6.0) -> remote 0.14.* / hosted 1.4.*；
  #           IDF >=6.0      -> remote >=1.6,<2.0 / hosted >=2.12,<3.0
  # 依据：微雪官方 04_wifistation 示例的 main/idf_component.yml。
  # 注意 esp-extconn 与 esp-hosted 互斥，本项目确认不含 esp-extconn。
  espressif/esp_wifi_remote: "0.14.*"
  espressif/esp_hosted: "1.4.*"
  espressif/esp_lcd_st7701:
    override_path: ../components/esp_lcd_st7701
  espressif/esp_lvgl_adapter:
    override_path: ../components/esp_lvgl_adapter
  espressif/tinyusb: "*"
  waveshare/esp32_p4_wifi6_touch_lcd_4_3:
    override_path: ../components/esp32_p4_wifi6_touch_lcd_4_3
